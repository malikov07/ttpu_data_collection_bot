<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- TTPU student data bot: profile picture. Telegram crops it to a circle:
       everything important stays within the central 760px. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a63b8"/>
      <stop offset="0.55" stop-color="#1a4d96"/>
      <stop offset="1" stop-color="#112a52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#081a36" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Content, scaled up a little and centred for small avatar sizes -->
  <g transform="translate(512 512) scale(1.12) translate(-542 -553)">
  <!-- ID card -->
  <g filter="url(#shadow)">
    <rect x="232" y="298" width="560" height="360" rx="44" fill="#ffffff"/>
  </g>
  <!-- card header stripe -->
  <path d="M232 342a44 44 0 0 1 44-44h472a44 44 0 0 1 44 44v26H232z" fill="#d9e6f7"/>
  <!-- portrait area with the site's "T" mark -->
  <rect x="276" y="404" width="190" height="210" rx="26" fill="#1a4d96"/>
  <path d="M312 452h118v30h-44v100h-30V482h-44z" fill="#ffffff"/>
  <!-- text lines -->
  <rect x="502" y="420" width="246" height="26" rx="13" fill="#1a4d96"/>
  <rect x="502" y="472" width="200" height="22" rx="11" fill="#b6cdee"/>
  <rect x="502" y="516" width="230" height="22" rx="11" fill="#b6cdee"/>
  <rect x="502" y="560" width="160" height="22" rx="11" fill="#b6cdee"/>

  <!-- verified badge -->
  <g filter="url(#shadow)">
    <circle cx="760" cy="640" r="92" fill="#16a34a"/>
  </g>
  <circle cx="760" cy="640" r="92" fill="none" stroke="#ffffff" stroke-width="14"/>
  <path d="M714 642l32 32 64-68" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="512" y="808" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="96" font-weight="800" letter-spacing="14" fill="#ffffff">TTPU</text>
  </g>
</svg>
