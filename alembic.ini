# Migrations run automatically when the bot starts.
# To create a new migration after changing app/db/models.py:
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
